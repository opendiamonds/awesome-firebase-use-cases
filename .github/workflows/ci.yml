name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/**

permissions:
  contents: read

jobs:
  repo-contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate repository contract
        run: python scripts/validate_repo_contract.py
