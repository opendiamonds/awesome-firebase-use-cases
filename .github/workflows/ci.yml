name: CI

# The filename is load-bearing: scripts/validate_repo_contract.py lists
# .github/workflows/ci.yml in REQUIRED_FILES, so renaming this file fails the
# very contract it enforces.

on:
  pull_request:
  push:
    branches:
      - main
      - ut
      - "danniel/**"
      - "chore/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate repository contract
        run: python scripts/validate_repo_contract.py

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` is `tsc -b && vite build`, so this covers typecheck too.
      - name: Typecheck and build
        run: npm run build

  backend:
    name: Backend (import + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Import smoke: catches syntax errors, bad imports, and router wiring
      # mistakes at CI time rather than on the deploy host. The unit suite below
      # covers behaviour; this step still catches breakage the suite never imports.
      - name: Import FastAPI app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cloud360
          JWT_SECRET: ci_only_not_a_real_secret
        run: python -c "import main; print('app:', main.app.title)"

      # Unit suite (SQLite in-memory; psycopg2 mocked in tests/helpers.py)
      - name: Run unit tests
        env:
          JWT_SECRET: ci_only_not_a_real_secret
        run: python -m unittest discover -s tests -v

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — the deploy job on the self-hosted runner is what actually
      # ships. This exists so a broken Dockerfile fails the PR, not the deploy.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_BASE_URL=https://cloud360.danniel.cc
          cache-from: type=gha
          cache-to: type=gha,mode=max
