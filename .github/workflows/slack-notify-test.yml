name: Slack notify test (temporary)

# TEMPORARY. Verifies the Slack notification wiring added to deploy.yml without
# running a deploy: it proves the token works, the bot is in #nemoclaw, the
# message renders, and <!here> actually notifies. Delete once verified.
#
# The compose script below is copied verbatim from the notify job in
# deploy.yml so this exercises the real logic rather than a lookalike.

on:
  push:
    branches:
      - danniel/chore/gh-aw-init
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Post test messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Slack token is configured
        id: slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "::warning::SLACK_BOT_TOKEN is not set — skipping the Slack notification" >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Backdated so the duration formatting gets exercised too.
      - name: Fake a deploy start time
        id: fake
        run: echo "started=$(( $(date +%s) - 193 ))" >> "$GITHUB_OUTPUT"

      - name: Compose the Slack payload (success scenario)
        if: steps.slack.outputs.configured == 'true'
        env:
          CHANNEL_ID: C0B5XEQDVR7
          DEPLOY_RESULT: success
          ROLLBACK_RESULT: skipped
          RESTORED: ""
          REVERT_PR: ""
          DEPLOYED_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: "🧪 通知功能測試，並非真實部署"
          STARTED: ${{ steps.fake.outputs.started }}
          PR_NUMBER: ""
          PR_TITLE: ""
          PR_MERGED_BY: ""
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/pull
        run: |
          set -euo pipefail

          SHORT="${DEPLOYED_SHA:0:7}"
          [ -n "${SHORT}" ] || SHORT="(未知)"

          if [ -n "${STARTED}" ]; then
            ELAPSED=$(( $(date +%s) - STARTED ))
            DURATION="$(( ELAPSED / 60 )) 分 $(( ELAPSED % 60 )) 秒"
          else
            DURATION="未知"
          fi

          if [ -n "${PR_NUMBER}" ]; then
            PR_LINE="PR: <${PR_BASE_URL}/${PR_NUMBER}|#${PR_NUMBER}> ${PR_TITLE}（合併者 ${PR_MERGED_BY:-未知}）"
          else
            PR_LINE="觸發: 手動 workflow_dispatch"
          fi

          {
            case "${DEPLOY_RESULT}" in
              success)   echo "✅ *Cloud-360 部署成功*" ;;
              cancelled) echo "⚪ *Cloud-360 部署已取消*" ;;
              # <!here> is the Slack API form of @here; a literal "@here" in a
              # chat.postMessage body renders as plain text and pings nobody.
              *)         echo "<!here> ❌ *Cloud-360 部署失敗*" ;;
            esac
            echo ""
            echo "commit: \`${SHORT}\` ${COMMIT_SUBJECT:-}"
            echo "${PR_LINE}"
            echo "耗時: ${DURATION}"
            echo "run: <${RUN_URL}|GitHub Actions>"
            if [ "${DEPLOY_RESULT}" = "success" ]; then
              echo "公開: https://cloud360.danniel.cc"
              echo "內網: http://192.168.10.10:8090"
            fi
            if [ -n "${ROLLBACK_RESULT}" ] && [ "${ROLLBACK_RESULT}" != "skipped" ]; then
              echo ""
              case "${RESTORED}" in
                healthy)   echo "回滾: 已還原至上一個正常版本，服務健康" ;;
                unhealthy) echo "回滾: 已嘗試還原，但服務仍未恢復" ;;
                none)      echo "回滾: 沒有可用的 last-good 版本，未執行還原" ;;
                *)         echo "回滾: 結果未知（rollback job ${ROLLBACK_RESULT}）" ;;
              esac
              if [ -n "${REVERT_PR}" ]; then
                echo "Revert PR: <${REVERT_PR}|待合併>"
              else
                echo "Revert PR: 未建立（衝突或建立失敗），需人工處理"
              fi
              echo "Deploy Doctor: 已派工，根因分析請見新開的 issue"
            fi
          } > message.txt

          jq -Rs --arg channel "${CHANNEL_ID}" \
            '{channel: $channel, text: ., mrkdwn: true}' message.txt > payload.json
          echo "payload composed ($(wc -c < payload.json) bytes)"

      - name: Send the Slack message (success scenario)
        id: send_success
        if: steps.slack.outputs.configured == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: payload.json
          errors: false

      - name: Report the Slack API verdict (success scenario)
        if: always() && steps.slack.outputs.configured == 'true'
        env:
          OK: ${{ steps.send_success.outputs.ok }}
          RESPONSE: ${{ steps.send_success.outputs.response }}
          TS: ${{ steps.send_success.outputs.ts }}
        run: |
          echo "[success] ok=${OK:-unset}  ts=${TS:-none}"
          echo "[success] response=${RESPONSE:-none}"

      - name: Compose the Slack payload (failure scenario)
        if: steps.slack.outputs.configured == 'true'
        env:
          CHANNEL_ID: C0B5XEQDVR7
          DEPLOY_RESULT: failure
          ROLLBACK_RESULT: success
          RESTORED: healthy
          REVERT_PR: https://github.com/opendiamonds/cloud-360/pull/0
          DEPLOYED_SHA: ${{ github.sha }}
          COMMIT_SUBJECT: "🧪 通知功能測試，並非真實部署失敗"
          STARTED: ${{ steps.fake.outputs.started }}
          PR_NUMBER: "0"
          PR_TITLE: "（測試用假 PR）"
          PR_MERGED_BY: danniel
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/pull
        run: |
          set -euo pipefail

          SHORT="${DEPLOYED_SHA:0:7}"
          [ -n "${SHORT}" ] || SHORT="(未知)"

          if [ -n "${STARTED}" ]; then
            ELAPSED=$(( $(date +%s) - STARTED ))
            DURATION="$(( ELAPSED / 60 )) 分 $(( ELAPSED % 60 )) 秒"
          else
            DURATION="未知"
          fi

          if [ -n "${PR_NUMBER}" ]; then
            PR_LINE="PR: <${PR_BASE_URL}/${PR_NUMBER}|#${PR_NUMBER}> ${PR_TITLE}（合併者 ${PR_MERGED_BY:-未知}）"
          else
            PR_LINE="觸發: 手動 workflow_dispatch"
          fi

          {
            case "${DEPLOY_RESULT}" in
              success)   echo "✅ *Cloud-360 部署成功*" ;;
              cancelled) echo "⚪ *Cloud-360 部署已取消*" ;;
              # <!here> is the Slack API form of @here; a literal "@here" in a
              # chat.postMessage body renders as plain text and pings nobody.
              *)         echo "<!here> ❌ *Cloud-360 部署失敗*" ;;
            esac
            echo ""
            echo "commit: \`${SHORT}\` ${COMMIT_SUBJECT:-}"
            echo "${PR_LINE}"
            echo "耗時: ${DURATION}"
            echo "run: <${RUN_URL}|GitHub Actions>"
            if [ "${DEPLOY_RESULT}" = "success" ]; then
              echo "公開: https://cloud360.danniel.cc"
              echo "內網: http://192.168.10.10:8090"
            fi
            if [ -n "${ROLLBACK_RESULT}" ] && [ "${ROLLBACK_RESULT}" != "skipped" ]; then
              echo ""
              case "${RESTORED}" in
                healthy)   echo "回滾: 已還原至上一個正常版本，服務健康" ;;
                unhealthy) echo "回滾: 已嘗試還原，但服務仍未恢復" ;;
                none)      echo "回滾: 沒有可用的 last-good 版本，未執行還原" ;;
                *)         echo "回滾: 結果未知（rollback job ${ROLLBACK_RESULT}）" ;;
              esac
              if [ -n "${REVERT_PR}" ]; then
                echo "Revert PR: <${REVERT_PR}|待合併>"
              else
                echo "Revert PR: 未建立（衝突或建立失敗），需人工處理"
              fi
              echo "Deploy Doctor: 已派工，根因分析請見新開的 issue"
            fi
          } > message.txt

          jq -Rs --arg channel "${CHANNEL_ID}" \
            '{channel: $channel, text: ., mrkdwn: true}' message.txt > payload.json
          echo "payload composed ($(wc -c < payload.json) bytes)"

      - name: Send the Slack message (failure scenario)
        id: send_failure
        if: steps.slack.outputs.configured == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: payload.json
          errors: false

      - name: Report the Slack API verdict (failure scenario)
        if: always() && steps.slack.outputs.configured == 'true'
        env:
          OK: ${{ steps.send_failure.outputs.ok }}
          RESPONSE: ${{ steps.send_failure.outputs.response }}
          TS: ${{ steps.send_failure.outputs.ts }}
        run: |
          echo "[failure] ok=${OK:-unset}  ts=${TS:-none}"
          echo "[failure] response=${RESPONSE:-none}"

      # Surface the API response explicitly: errors: false means a Slack-side
      # rejection (not_in_channel, invalid_auth) is only a log line otherwise,
      # and the whole point of this run is to catch exactly that.
      - name: Report the Slack API result
        if: always()
        run: |
          echo "檢查上面兩個 send 步驟的輸出：ok=true 代表送達；"
          echo "not_in_channel 代表 bot 還沒被邀請進 #nemoclaw；"
          echo "invalid_auth 代表 SLACK_BOT_TOKEN 有問題。"
