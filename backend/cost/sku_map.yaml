regions:
  - us-east-1
  - us-west-2
  - eu-west-1

mappings:
  # draw.io 原生 aws4 resourceIcon
  - match_res_icon: mxgraph.aws4.ec2
    cloud: aws
    sku: AmazonEC2
    category: compute
  - match_res_icon: mxgraph.aws4.rds
    cloud: aws
    sku: AmazonRDS
    category: database
  - match_res_icon: mxgraph.aws4.s3
    cloud: aws
    sku: AmazonS3
    category: storage
  - match_res_icon: mxgraph.aws4.elastic_load_balancing
    cloud: aws
    sku: AWSELB
    category: network
  - match_res_icon: mxgraph.aws4.elastic_file_system
    cloud: aws
    sku: AmazonEFS
    category: storage
  - match_res_icon: mxgraph.aws4.elasticache
    cloud: aws
    sku: AmazonElastiCache
    category: database
  - match_res_icon: mxgraph.aws4.route_53
    cloud: aws
    sku: AmazonRoute53
    category: network
  - match_res_icon: mxgraph.aws4.waf
    cloud: aws
    sku: AWSWAF
    category: network
  - match_res_icon: mxgraph.aws4.cloudfront
    cloud: aws
    sku: AmazonCloudFront
    category: network
  - match_res_icon: mxgraph.aws4.shield
    cloud: aws
    sku: AWSShield
    category: network

  # A1 產圖：shape=image + 全大寫 label（不依賴 style 含 aws4）
  - match_labels: [EC2, Amazon EC2]
    cloud: aws
    sku: AmazonEC2
    category: compute
  - match_labels: [RDS, Amazon RDS, Aurora]
    cloud: aws
    sku: AmazonRDS
    category: database
  - match_labels: [S3, Amazon S3]
    cloud: aws
    sku: AmazonS3
    category: storage
  # 不用泛稱 "Load Balancer"（會與 GCP Cloud Load Balancer 歧義）
  - match_labels:
      - ALB
      - ELB
      - Elastic Load Balancing
      - Application Load Balancer
    cloud: aws
    sku: AWSELB
    category: network
  - match_labels: [EFS, Amazon EFS, Elastic File System]
    cloud: aws
    sku: AmazonEFS
    category: storage
  - match_labels: [ElastiCache, Amazon ElastiCache]
    cloud: aws
    sku: AmazonElastiCache
    category: database
  - match_labels: [Route 53, Route53, Amazon Route 53]
    cloud: aws
    sku: AmazonRoute53
    category: network
  - match_labels: [WAF, AWS WAF]
    cloud: aws
    sku: AWSWAF
    category: network
  - match_labels: [CloudFront, Amazon CloudFront]
    cloud: aws
    sku: AmazonCloudFront
    category: network
  - match_labels: [Shield, AWS Shield]
    cloud: aws
    sku: AWSShield
    category: network
  - match_labels: [ECS, Amazon ECS, Fargate]
    cloud: aws
    sku: AmazonECS
    category: compute
  - match_labels: [EKS, Amazon EKS]
    cloud: aws
    sku: AmazonEKS
    category: compute
  - match_labels: [Lambda, AWS Lambda]
    cloud: aws
    sku: AWSLambda
    category: compute
  - match_labels: [CloudWatch, Amazon CloudWatch]
    cloud: aws
    sku: AmazonCloudWatch
    category: other
  - match_labels: [NAT Gateway, NATGateway, NAT]
    cloud: aws
    sku: AmazonEC2NatGateway
    category: network
  - match_labels: [API Gateway, Amazon API Gateway, ApiGateway]
    cloud: aws
    sku: AmazonApiGateway
    category: network
  - match_labels: [Glue, AWS Glue]
    cloud: aws
    sku: AWSGlue
    category: other
  - match_labels: [SageMaker, Amazon SageMaker, Sagemaker]
    cloud: aws
    sku: AmazonSageMaker
    category: compute
  - match_labels: [Athena, Amazon Athena]
    cloud: aws
    sku: AmazonAthena
    category: other

  # GCP A1 產圖：shape=image + 全大寫 label
  - match_labels: [Compute Engine, GCE]
    cloud: gcp
    sku: ComputeEngine
    category: compute
  - match_labels: [GKE, Google Kubernetes Engine, Kubernetes Engine]
    cloud: gcp
    sku: KubernetesEngine
    category: compute
  - match_labels: [Cloud Run]
    cloud: gcp
    sku: CloudRun
    category: compute
  - match_labels: [Cloud SQL, CloudSQL]
    cloud: gcp
    sku: CloudSQL
    category: database
  - match_labels: [Cloud Storage, GCS]
    cloud: gcp
    sku: CloudStorage
    category: storage
  - match_labels: [Cloud DNS]
    cloud: gcp
    sku: CloudDNS
    category: network
  - match_labels: [Cloud Load Balancing, Cloud Load Balancer]
    cloud: gcp
    sku: Networking
    category: network
  - match_labels: [Cloud Armor]
    cloud: gcp
    sku: CloudArmor
    category: network
  - match_labels: [Cloud CDN]
    cloud: gcp
    sku: CloudCDN
    category: network
  - match_labels: [Apigee]
    cloud: gcp
    sku: Apigee
    category: network
  # 大小寫／空白由 sku_mapper casefold + compact 處理（BIGQUERY／CLOUDRUN 皆可）
  - match_labels: [BigQuery]
    cloud: gcp
    sku: BigQuery
    category: other
  - match_labels: [Firestore]
    cloud: gcp
    sku: Firestore
    category: database
  - match_labels: [Vertex AI, VertexAI]
    cloud: gcp
    sku: VertexAI
    category: compute
  - match_labels: [Secret Manager, SecretManager]
    cloud: gcp
    sku: SecretManager
    category: other
  - match_labels:
      - Google Cloud Observability
      - Cloud Observability
      - Cloud Monitoring
    cloud: gcp
    sku: CloudObservability
    category: other

  # Azure A1 產圖：shape=image + 全大寫 label（Retail Prices armRegionName）
  - match_labels: [AKS, Azure Kubernetes Service]
    cloud: azure
    sku: AzureKubernetesService
    category: compute
  - match_labels: [Virtual Machines, Azure VM, Azure Virtual Machines]
    cloud: azure
    sku: VirtualMachines
    category: compute
  - match_labels: [Application Gateway, Azure Application Gateway]
    cloud: azure
    sku: ApplicationGateway
    category: network
  - match_labels: [Azure Blob Storage, Blob Storage]
    cloud: azure
    sku: AzureBlobStorage
    category: storage
  - match_labels: [Azure Cosmos DB, Cosmos DB, CosmosDB]
    cloud: azure
    sku: AzureCosmosDB
    category: database
  - match_labels: [Azure SQL Database, Azure SQL, SQL Database]
    cloud: azure
    sku: AzureSQLDatabase
    category: database
  - match_labels: [Azure Key Vault, Key Vault]
    cloud: azure
    sku: KeyVault
    category: other
  - match_labels: [Azure Monitor]
    cloud: azure
    sku: AzureMonitor
    category: other
  - match_labels: [Azure Front Door, Front Door]
    cloud: azure
    sku: AzureFrontDoor
    category: network
  - match_labels: [Azure CDN]
    cloud: azure
    sku: AzureCDN
    category: network
  - match_labels: [Web Application Firewall, Azure Firewall]
    cloud: azure
    sku: AzureFirewall
    category: network
  - match_labels: [Log Analytics]
    cloud: azure
    sku: LogAnalytics
    category: other
  - match_labels: [Recovery Services Vault, Azure Backup]
    cloud: azure
    sku: AzureBackup
    category: storage

  - match_res_icon: mxgraph.gcp2.compute_engine
    cloud: gcp
    sku: ComputeEngine
    category: compute
  - match_res_icon: mxgraph.gcp.gke
    cloud: gcp
    sku: KubernetesEngine
    category: compute
  - match_res_icon: mxgraph.gcp.cloudsql
    cloud: gcp
    sku: CloudSQL
    category: database
